task_type: fcst2era5fit

# 獨立系統 B2：輸入 S2S wind100m（純量風速），輸出 ERA5 wind100m = sqrt(u100^2 + v100^2)

data:
  era5_root: "D:/downsampling_focas/ERA5/hourly"
  s2s_root: "D:/downsampling_focas/S2S"
  lcz_path: "D:/downsampling_focas/LCZ_data/lcz_probability_v3.tif"
  lcz_band: 1
  lcz_resampling: "average"
  models: ["CMA", "ECMWF", "NECP", "UNKO"]

  s2s_vars: ["wind100m"]
  era5_target_vars: ["wind100m"]   # 導出變數：sqrt(u100^2 + v100^2)
  static_features: null

  s2s_grid_h: 121
  s2s_grid_w: 240
  era5_grid_h: 721
  era5_grid_w: 1440
  grid_h: 121
  grid_w: 240
  num_leads: 45
  demo_grid_h: 16
  demo_grid_w: 32
  demo_mode: false

  sample_cache_root: "D:/downsampling_focas/sample_cache_wind100m"
  use_sample_cache: false

  s2s_var_divisors:
    wind100m: 1.0
  era5_target_divisors:
    wind100m: 1.0

  region:
    enabled: true
    lat_min: 15
    lat_max: 55
    lon_min: 70
    lon_max: 140

model:
  num_models: 4
  c_in: 1
  c_static: 5
  c_out_uv: 1
  c_out_conv: 0
  num_leads: 45
  d_model: 128
  d_hidden: 256
  n_heads: 8
  n_encoder_layers: 3
  n_correction_blocks: 4
  dropout: 0.1

  # ---- WaveletLCZForecastEncoder ----
  wavelet_levels: 2
  wavelet_type: "haar"
  wavelet_include_raw: true

  use_lcz_window_cross_attention: true
  use_lcz_2d_rope: true
  lcz_attn_window_size: 8
  lcz_attn_heads: 4
  lcz_rope_base: 10000.0

  use_lcz_scale_gate: true
  scale_gate_hidden_dim: 128

  use_post_lcz_conditioner: false

training:
  epochs: 50
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 5
  grad_clip: 1.0
  save_dir: "checkpoints/task_b_wind100m_new"
  log_dir: "logs/task_b_wind100m_new"

loss:
  uv_weight: 1.0
  conv_weight: 0.0
  conv_consistency_weight: 0.0
  direction_weight: 0.0
  gradient_weight: 0.1
  lead_decay: 0.95
